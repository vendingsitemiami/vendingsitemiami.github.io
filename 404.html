<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Miami Service Amenities</title>
  <script>
    const t = localStorage.getItem('theme');
    if (t === 'light') document.documentElement.classList.remove('dark');
    else document.documentElement.classList.add('dark');
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brand: '#2563eb' } } }
    };
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'DM Sans', sans-serif; }

    .scanlines {
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    html.dark .scanlines {
      background: repeating-linear-gradient(
        to bottom,
        transparent, transparent 3px,
        rgba(255,255,255,0.025) 3px, rgba(255,255,255,0.025) 4px
      );
    }
    html:not(.dark) .scanlines {
      background: repeating-linear-gradient(
        to bottom,
        transparent, transparent 3px,
        rgba(0,0,0,0.04) 3px, rgba(0,0,0,0.04) 4px
      );
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image:
        linear-gradient(rgba(37,99,235,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(37,99,235,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .glow-blue {
      position: fixed;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37,99,235,0.18) 0%, transparent 70%);
      top: -200px; left: -150px;
      pointer-events: none;
      z-index: 0;
    }
    .glow-red {
      position: fixed;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239,68,68,0.1) 0%, transparent 70%);
      bottom: -150px; right: -100px;
      pointer-events: none;
      z-index: 0;
    }

    .btn-primary {
      background: #2563eb;
      color: #fff;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    }
    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 4px 24px rgba(37,99,235,0.45);
    }
    .btn-primary:active { transform: translateY(0); }

    .btn-ghost {
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(255,255,255,0.7);
      transition: border-color 0.15s, color 0.15s, transform 0.1s;
    }
    .btn-ghost:hover {
      border-color: rgba(255,255,255,0.3);
      color: #fff;
      transform: translateY(-1px);
    }
    html:not(.dark) .btn-ghost {
      border: 1px solid rgba(0,0,0,0.14);
      color: rgba(0,0,0,0.65);
    }
    html:not(.dark) .btn-ghost:hover { border-color: rgba(0,0,0,0.3); color: #0f172a; }

    .fade-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.55s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .dark-toggle { transition: background 0.2s, transform 0.15s; }
    .dark-toggle:hover { transform: scale(1.1); }

    html.dark body { background: #030712; }
    html:not(.dark) body { background: #f8fafc; }
  </style>
</head>

<body class="min-h-screen overflow-x-hidden">

<div class="scanlines"></div>
<div class="grid-bg"></div>
<div class="glow-blue"></div>
<div class="glow-red"></div>

<!-- NAV -->
<nav class="relative z-50 border-b border-white/[0.06] dark:border-white/[0.06] bg-black/40 dark:bg-black/40 backdrop-blur-xl">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-20">
    <div class="flex items-center justify-between h-16 gap-4">
      <a href="/" class="text-sm sm:text-base font-bold text-white truncate shrink-0 tracking-tight">
        Miami Service Amenities
      </a>
      <div class="hidden md:flex items-center gap-6 lg:gap-8 shrink-0">
        <a href="./index.html#info" class="text-white/50 hover:text-white text-sm transition-colors whitespace-nowrap">Info</a>
        <a href="./index.html#faq" class="text-white/50 hover:text-white text-sm transition-colors whitespace-nowrap">FAQ</a>
        <a href="./how-it-works.html" class="text-white/50 hover:text-white text-sm transition-colors whitespace-nowrap">How it works</a>
        <a href="./gallery.html" class="text-white/50 hover:text-white text-sm transition-colors whitespace-nowrap">Gallery</a>
        <button id="darkToggleDesktop" class="dark-toggle p-2 rounded-lg bg-white/5 hover:bg-white/10 text-white/60 hover:text-white" aria-label="Toggle theme">
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
        <a href="./form.html" class="btn-primary flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap">
          <i data-lucide="package" class="w-4 h-4 shrink-0"></i>
          Request a Machine
        </a>
      </div>
      <div class="flex md:hidden items-center gap-2 shrink-0">
        <button id="darkToggleMobile" class="dark-toggle p-2 rounded-lg bg-white/5 text-white/60" aria-label="Toggle theme">
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
        <button id="menuBtn" class="p-2 rounded-lg bg-white/5 text-white" aria-label="Toggle menu">
          <i data-lucide="menu" class="w-5 h-5 block" id="menuIcon"></i>
          <i data-lucide="x" class="w-5 h-5 hidden" id="closeIcon"></i>
        </button>
      </div>
    </div>
  </div>
  <div id="mobileMenu" class="hidden md:hidden border-t border-white/[0.06] bg-black/60 backdrop-blur-xl">
    <div class="px-6 py-5 space-y-3 text-center">
      <a href="./index.html#info" class="block text-white/60 hover:text-white py-1.5 text-sm transition-colors">Info</a>
      <a href="./index.html#faq" class="block text-white/60 hover:text-white py-1.5 text-sm transition-colors">FAQ</a>
      <a href="./how-it-works.html" class="block text-white/60 hover:text-white py-1.5 text-sm transition-colors">How it works</a>
      <a href="./gallery.html" class="block text-white/60 hover:text-white py-1.5 text-sm transition-colors">Gallery</a>
      <a href="./form.html" class="btn-primary flex items-center justify-center gap-2 px-6 py-3 rounded-xl font-medium text-sm mt-2">
        <i data-lucide="package" class="w-4 h-4"></i>
        Request a Machine
      </a>
    </div>
  </div>
</nav>

<!-- 404 CONTENT -->
<main class="relative z-10 flex items-center justify-center min-h-[calc(100vh-64px)] px-4 py-16">
  <div class="max-w-xl w-full text-center">
    <div class="flex flex-col items-center gap-6">

      <div class="fade-up" style="animation-delay:0.05s">
        <div class="text-[#0f172a] dark:text-white" style="font-family:'Syne',sans-serif; font-weight:900; font-size:clamp(7rem,22vw,14rem); line-height:1; letter-spacing:-0.04em;">
          404
        </div>
      </div>

      <div class="fade-up" style="animation-delay:0.2s">
        <h1 class="text-2xl sm:text-3xl font-bold text-white dark:text-white mb-3" style="font-family:'Syne',sans-serif;">
          Page Not Found
        </h1>
        <p class="text-white/40 text-sm sm:text-base leading-relaxed max-w-sm mx-auto">
          The page you're looking for may have been moved, renamed, or no longer exists.
        </p>
      </div>

      <div class="fade-up flex flex-col sm:flex-row gap-3 w-full max-w-sm" style="animation-delay:0.35s">
        <a href="/" class="btn-primary flex items-center justify-center gap-2 flex-1 px-6 py-3.5 rounded-xl font-semibold text-sm">
          <i data-lucide="house" class="w-4 h-4 shrink-0"></i>
          Go Home
        </a>
        <a href="./form.html" class="btn-ghost flex items-center justify-center gap-2 flex-1 px-6 py-3.5 rounded-xl font-semibold text-sm">
          <i data-lucide="package" class="w-4 h-4 shrink-0"></i>
          Request a Machine
        </a>
      </div>

      <div class="fade-up" style="animation-delay:0.5s">
        <p class="text-white/20 text-xs">© 2026 Miami Service Amenities</p>
      </div>

    </div>
  </div>
</main>

<script>
  lucide.createIcons();

  const html = document.documentElement;

  const menuBtn = document.getElementById('menuBtn');
  const mobileMenu = document.getElementById('mobileMenu');
  const menuIcon = document.getElementById('menuIcon');
  const closeIcon = document.getElementById('closeIcon');

  menuBtn.addEventListener('click', () => {
    const isHidden = mobileMenu.classList.toggle('hidden');
    menuIcon.classList.toggle('hidden', !isHidden);
    closeIcon.classList.toggle('hidden', isHidden);
  });

  function toggleDark() {
    const isDark = html.classList.toggle('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    lucide.createIcons();
  }

  document.getElementById('darkToggleDesktop').addEventListener('click', toggleDark);
  document.getElementById('darkToggleMobile').addEventListener('click', toggleDark);
</script>
</body>
</html>
